version: 2
updates:
  # Not ts/: its wasm-* dependencies are file: links to packages a wasm build
  # writes, and Dependabot never builds them, so every run there failed.
  # `site update` keeps ts/ current instead.
  - package-ecosystem: "bun"
    directories: ["/"]
    schedule:
      interval: "weekly"
    groups:
      production-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
    ignore:
      - dependency-name: "shiki"
        versions: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      ci-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directories: ["/", "/programs/conversations-blogpost", "/programs/count_movies"]
    schedule:
      interval: "weekly"
    groups:
      rust-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
