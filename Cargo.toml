[workspace]
members = [
    "tools/site",
    "crates/engrave",
    "crates/recursive_ji_core",
    "wasm/wasm",
    "wasm/textprocessing",
    "wasm/adventofcode",
    "wasm/tuningplayground",
    "wasm/tuningplayground/keymapping",
    "wasm/tuningplayground/chord_generator",
    "wasm/textprocessing/hangeul_conversion",
]
resolver = "2"

# Scratch programs, each with its own lockfile and its own life. Sitting under
# the workspace root without being members or excluded meant cargo refused to
# run in either of them at all -- "believes it's in a workspace when it's not".
exclude = ["programs"]

[workspace.dependencies]
music21-rs = { git = "https://github.com/float3/music21-rs.git" }
wasm-bindgen = { version = "0.2.127" }
console_error_panic_hook = { version = "0.1.7" }
mini-alloc = { version = "1.0.0" }
engrave = { path = "./crates/engrave" }
recursive-ji-core = { path = "./crates/recursive_ji_core" }

# Cargo only honours `[profile.*]` from the workspace root; the copy that used to
# sit in wasm/wasm/Cargo.toml was silently ignored, so every release wasm was
# built with plain defaults. Size is what matters for the artifacts that ship.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"

# `site` is a build tool, not a payload: it wants to run fast, not be small.
[profile.release.package.site]
opt-level = 3
