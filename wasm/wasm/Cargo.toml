[package]
name = "wasm"
version = "0.1.0"
authors = ["hill"]
edition = "2024"
license = "agpl-3.0"
description = "WebAssembly"
repository = "https://github.com/float3/float3.github.io/tree/master/wasm/wasm"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["mini-alloc"]
console_error_panic_hook = ["dep:console_error_panic_hook"]
mini-alloc = ["dep:mini-alloc"]
aoc = ["dep:adventofcode"]
bayes = []
chars = []
glsl = ["dep:glsl2hlsl"]
movies = []
photography = []
polyrhythm = ["dep:music21-rs"]
recursive_ji = ["dep:music21-rs", "dep:recursive-ji-core"]
textprocessing = ["dep:textprocessing"]
pokemon = ["dep:krabby"]
trolley = []
tuningplayground = ["dep:tuningplayground", "dep:music21-rs"]

[dependencies]
tuningplayground = { path = "../tuningplayground/", optional = true }
music21-rs = { workspace = true, optional = true }
# [target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
console_error_panic_hook = { workspace = true, optional = true }
mini-alloc = { workspace = true, optional = true }
glsl2hlsl = { path = "../glsl2hlsl", optional = true }
adventofcode = { path = "../adventofcode/", optional = true }
textprocessing = { path = "../textprocessing/", optional = true }
recursive-ji-core = { workspace = true, optional = true }
web-sys = { version = "0.3.103", features = [
    "Window",
    "Document",
    "CanvasRenderingContext2d",
    "HtmlCanvasElement",
] }
getrandom = { version = "0.4.3", features = ["wasm_js"] }
krabby = { git = "https://github.com/float3/krabby/", features = [
    "debug-embed",
    "html",
], optional = true }
unicode-width = "0.2.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Transitive crates still pull getrandom 0.3, and the wasm build sets
# getrandom_backend="wasm_js" globally.
getrandom_03 = { package = "getrandom", version = "0.3.4", features = [
    "wasm_js",
] }

[dev-dependencies]
wasm-bindgen-test = "0.3.76"

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = true
lto = true
opt-level = 's'
overflow-checks = false
panic = "unwind"
rpath = false
split-debuginfo = "off"
strip = "symbols"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-Os', '--enable-bulk-memory', '--enable-nontrapping-float-to-int']
# wasm-opt = false

[package.metadata.wasm-pack.profile.release.wasm-bindgen]
debug-js-glue = false
demangle-name-section = false
dwarf-debug-info = false
omit-default-module-path = false
