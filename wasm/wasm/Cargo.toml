[package]
name = "wasm"
version = "0.1.0"
authors = ["hill"]
edition = "2024"
license = "agpl-3.0"
description = "WebAssembly"
repository = "https://github.com/float3/float3.github.io/tree/master/wasm/wasm"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["mini-alloc"]
console_error_panic_hook = ["dep:console_error_panic_hook"]
mini-alloc = ["dep:mini-alloc"]
aoc = ["dep:adventofcode"]
bayes = []
chars = []
gallery = []
glsl = ["dep:glsl2hlsl"]
movies = []
photography = []
polyrhythm = ["dep:music21-rs"]
textprocessing = ["dep:textprocessing"]
pokemon = ["dep:krabby"]
textprocessing_chinese = ["textprocessing", "textprocessing/chinese"]
textprocessing_korean = ["textprocessing", "textprocessing/korean"]
tuningplayground = ["dep:tuningplayground", "dep:music21-rs"]

[package.metadata.site]
# Tools kept in the tree but left out of the build. `site` skips these, so the
# source stays put and costs nothing: pokemon's krabby dependency embeds every
# sprite and compiles to a 37 MB wasm artifact. Move a name out of here to
# bring it back, and give it a webpack entry in ts/ at the same time; the
# TypeScript that drove this one is at 6e56b25c:ts/src/pokemon.ts.
parked-tools = ["pokemon"]

[dependencies]
tuningplayground = { path = "../tuningplayground/", optional = true }
music21-rs = { workspace = true, optional = true }
# [target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
console_error_panic_hook = { workspace = true, optional = true }
mini-alloc = { workspace = true, optional = true }
glsl2hlsl = { git = "https://github.com/float3/glsl2hlsl", branch = "fold-site-changes", optional = true }
adventofcode = { path = "../adventofcode/", optional = true }
textprocessing = { path = "../textprocessing/", optional = true, default-features = false }
web-sys = { version = "0.3.103", features = [
    "Window",
    "Document",
    "CanvasRenderingContext2d",
    "HtmlCanvasElement",
] }
getrandom = { version = "0.4.3", features = ["wasm_js"] }
unicode-width = "0.2.2"
krabby = { git = "https://github.com/float3/krabby/", features = [
    "debug-embed",
    "html",
], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Transitive crates still pull getrandom 0.3, and the wasm build sets
# getrandom_backend="wasm_js" globally.
getrandom_03 = { package = "getrandom", version = "0.3.4", features = [
    "wasm_js",
] }

[dev-dependencies]
wasm-bindgen-test = "0.3.76"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-Os', '--enable-bulk-memory', '--enable-nontrapping-float-to-int']
# wasm-opt = false

[package.metadata.wasm-pack.profile.release.wasm-bindgen]
debug-js-glue = false
demangle-name-section = false
dwarf-debug-info = false
omit-default-module-path = false
