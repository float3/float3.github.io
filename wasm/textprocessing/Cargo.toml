[package]
name = "textprocessing"
version = "1.0.0"
edition = "2024"
authors = ["hill <hill@hilll.dev>"]
description = "expose some text processing functions to wasm"
license = "AGPL-3.0"
repository = "https://github.com/float3/float3.github.io"

# The CJK dictionaries are the whole weight of this crate: character_converter
# embeds 7.3 MB of conversion profiles and hanja a 6.4 MB dictionary, against
# well under a megabyte for everything else put together. Gating them behind
# features lets `wasm/wasm` build one package per language, so a visitor
# converting hex to text never downloads either.
[features]
default = ["chinese", "korean"]
chinese = [
    "dep:character_converter",
    "dep:chinese-number",
    "dep:pinyin",
    "dep:pinyin_zhuyin",
]
korean = ["dep:hanja", "dep:hangeul_conversion"]

[dependencies]
base64 = "0.23.0"
japanese = "0.1.2"
japanese_number_converter = { git = "https://github.com/float3/Japanese-number-converter", branch = "fix-kanji-two" }
num-bigint = "0.5.1"
num-traits = "0.2.19"
roman = "0.2.1"
wasm-bindgen = { workspace = true }

character_converter = { version = "2.1.5", optional = true }
chinese-number = { version = "0.8.2", optional = true }
pinyin = { version = "0.11.0", optional = true }
pinyin_zhuyin = { version = "0.2.0", optional = true }

hanja = { version = "0.1.1", optional = true }
hangeul_conversion = { path = "hangeul_conversion", optional = true }
