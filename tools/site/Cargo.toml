[package]
name = "site"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["photos"]
photos = ["dep:image", "dep:serde"]

[dependencies]
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "gif",
], optional = true }
music21-rs = { workspace = true }
recursive-ji-core = { path = "../../crates/recursive_ji_core" }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = "1.0.151"
toml = "1.1.4"

[[bin]]
name = "site"
path = "src/main.rs"
